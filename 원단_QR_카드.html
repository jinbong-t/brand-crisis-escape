<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧵 RE:BRAND - 원단 QR 카드 (인쇄 및 이미지 저장)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --gold: #d4af37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #1a1c24;
            color: #f0f0f0;
            min-height: 100vh;
            padding-bottom: 4rem;
        }

        /* =========================================
           상단 컨트롤 바 (인쇄 시 자동 숨김)
           ========================================= */
        .control-bar {
            background: linear-gradient(135deg, #1f2330 0%, #12141c 100%);
            border-bottom: 2px solid var(--gold);
            padding: 1.1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }

        .control-header {
            max-width: 1180px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .brand-title h1 {
            font-size: 1.25rem;
            color: var(--gold);
            font-weight: 900;
        }

        .brand-title p {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 2px;
        }

        .control-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
        }

        .ctrl-group {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(255,255,255,0.06);
            padding: 0.4rem 0.7rem;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.12);
        }

        .ctrl-group label {
            font-size: 0.8rem;
            color: #ccc;
            font-weight: 500;
            white-space: nowrap;
        }

        .ctrl-group input,
        .ctrl-group select {
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 5px;
            padding: 0.35rem 0.6rem;
            font-size: 0.82rem;
            font-family: inherit;
        }

        .btn {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 0.55rem 0.95rem;
            font-size: 0.86rem;
            font-weight: 700;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .btn-gold {
            background: linear-gradient(135deg, #e5c158, #b89020);
            color: #111;
        }

        .btn-save-sheet {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: #fff;
            box-shadow: 0 4px 14px rgba(52, 152, 219, 0.35);
        }

        .btn-save-each {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: #fff;
            box-shadow: 0 4px 14px rgba(155, 89, 182, 0.35);
        }

        .btn-print {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: #fff;
            box-shadow: 0 4px 14px rgba(46, 204, 113, 0.35);
        }

        .url-bar {
            max-width: 1180px;
            margin: 0.8rem auto 0;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .url-bar label {
            font-size: 0.8rem;
            color: var(--gold);
            font-weight: 700;
        }

        .url-bar input {
            flex: 1;
            min-width: 260px;
            background: rgba(0,0,0,0.45);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 0.45rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        /* =========================================
           원단 QR 카드 그리드
           ========================================= */
        .page-sheet {
            max-width: 1020px;
            margin: 2rem auto;
            padding: 1rem;
        }

        .fabric-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .fabric-grid.cols-2 {
            grid-template-columns: repeat(2, 1fr);
            max-width: 740px;
            margin: 0 auto;
        }

        /* =========================================
           원단 안에 정사각형 QR이 쏙 들어가는 디자인
           ========================================= */
        .fabric-swatch-card {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.45);
            page-break-inside: avoid;
            break-inside: avoid;
            border: 3px solid #cbb89d;
            padding: 22%;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .fabric-swatch-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 30px rgba(0,0,0,0.6);
        }

        /* 실제 원단 배경 이미지 레이어 */
        .fabric-bg-layer {
            position: absolute;
            inset: 0;
            background-image: url('조각 원단.png');
            background-repeat: no-repeat;
            z-index: 0;
        }

        /* 원단 직조(씨실/날실) 미세 질감 */
        .fabric-weave-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background-image:
                repeating-linear-gradient(
                    0deg,
                    rgba(120, 95, 65, 0.05) 0px,
                    rgba(120, 95, 65, 0.05) 1px,
                    transparent 1px,
                    transparent 4px
                ),
                repeating-linear-gradient(
                    90deg,
                    rgba(120, 95, 65, 0.04) 0px,
                    rgba(120, 95, 65, 0.04) 1px,
                    transparent 1px,
                    transparent 4px
                );
            pointer-events: none;
        }

        /* 원단 가장자리 바느질(스티치) 점선 테두리 */
        .fabric-stitch-border {
            position: absolute;
            inset: 10px;
            border: 2px dashed rgba(95, 72, 42, 0.65);
            border-radius: 5px;
            z-index: 2;
            pointer-events: none;
        }

        /* 원단 한가운데에 쏙 들어가는 정사각형 QR 라벨 패치 */
        .woven-qr-patch {
            position: relative;
            z-index: 3;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #fffdf9;
            padding: 12px;
            border-radius: 6px;
            box-shadow:
                0 5px 14px rgba(45, 32, 16, 0.3),
                0 1px 3px rgba(0,0,0,0.18);
            border: 1.5px solid #d8ccb8;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* QR 라벨 안쪽 실밥 스티치 라인 */
        .woven-qr-patch::before {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1.5px dashed #8b7355;
            border-radius: 4px;
            pointer-events: none;
            opacity: 0.7;
        }

        /* 네 모서리 고정 핀(리벳/실밥 매듭) */
        .corner-tack {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #f5e6c8, #9c7c48);
            border: 1.2px solid #5a4322;
            box-shadow: 0 1px 2px rgba(0,0,0,0.35);
            z-index: 5;
        }
        .corner-tack.tl { top: 7px; left: 7px; }
        .corner-tack.tr { top: 7px; right: 7px; }
        .corner-tack.bl { bottom: 7px; left: 7px; }
        .corner-tack.br { bottom: 7px; right: 7px; }

        .qr-frame {
            width: 100%;
            height: 100%;
            background: #ffffff;
            padding: 6px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-box {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-box canvas {
            display: none !important;
        }

        .qr-box img {
            width: 100% !important;
            height: 100% !important;
            max-width: 135px !important;
            max-height: 135px !important;
            aspect-ratio: 1 / 1 !important;
            object-fit: contain !important;
            display: block !important;
        }

        .qr-box canvas:only-child {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            max-width: 135px !important;
            max-height: 135px !important;
            aspect-ratio: 1 / 1 !important;
        }

        /* =========================================
           인쇄 전용 스타일 (@media print) - A4 1장에 6장 모두 출력 보장
           ========================================= */
        @media print {
            @page {
                size: A4 portrait;
                margin: 10mm;
            }

            html, body {
                width: 100% !important;
                height: auto !important;
                background: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .no-print {
                display: none !important;
            }

            .page-sheet {
                max-width: 185mm !important;
                margin: 0 auto !important;
                padding: 0 !important;
            }

            /* A4 세로 한 장에 2열 × 3행(총 6장)이 페이지 넘김 없이 딱 맞게 배치 */
            .fabric-grid,
            .fabric-grid.cols-2 {
                display: grid !important;
                grid-template-columns: repeat(2, 82mm) !important;
                justify-content: center !important;
                gap: 8mm !important;
            }

            .fabric-swatch-card {
                width: 82mm !important;
                height: 82mm !important;
                box-shadow: none !important;
                border: 2px solid #9e896b !important;
                padding: 20% !important;
                transform: none !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            .qr-box img,
            .qr-box canvas:only-child {
                max-width: 36mm !important;
                max-height: 36mm !important;
            }
        }
    </style>
</head>
<body>

    <!-- 상단 컨트롤 바 (인쇄 시 숨겨짐) -->
    <header class="control-bar no-print">
        <div class="control-header">
            <div class="brand-title">
                <span style="font-size: 2rem;">🧵</span>
                <div>
                    <h1>원단 QR 카드 생성기 (전체 6장)</h1>
                    <p>6개 부서의 원단 QR 카드를 한 번에 이미지로 저장하거나 A4 한 장에 6장 모두 인쇄할 수 있습니다.</p>
                </div>
            </div>

            <div class="control-actions">
                <div class="ctrl-group">
                    <label for="class-select">학급:</label>
                    <input type="text" id="class-select" value="3-1" style="width: 65px; text-align: center;">
                    <button id="btn-load-firebase" class="btn btn-gold" style="padding: 0.35rem 0.65rem; font-size: 0.78rem;">🔄 연동</button>
                </div>

                <div class="ctrl-group">
                    <label for="bg-mode-select">원단:</label>
                    <select id="bg-mode-select">
                        <option value="slice">🧩 6등분 퍼즐 조각</option>
                        <option value="full">🌿 전체 원단 무늬</option>
                    </select>
                </div>

                <div class="ctrl-group">
                    <label for="cols-select">배치:</label>
                    <select id="cols-select">
                        <option value="3">3열×2행</option>
                        <option value="2">2열×3행</option>
                    </select>
                </div>

                <button id="btn-save-sheet" class="btn btn-save-sheet" title="6개 원단 카드를 한 장의 고화질 PNG 이미지로 자동 저장합니다">
                    💾 전체 6장 합본 저장
                </button>

                <button id="btn-save-each" class="btn btn-save-each" title="각 부서별 원단 카드를 개별 PNG 이미지 파일 6장으로 자동 저장합니다">
                    🗂️ 6장 개별 자동 저장
                </button>

                <button id="btn-print-all" class="btn btn-print" title="A4 한 장에 6장 전체를 깔끔하게 인쇄합니다">
                    🖨️ 전체 6장 인쇄
                </button>
            </div>
        </div>

        <div class="url-bar">
            <label for="base-url-input">🔗 QR 연결 주소 (게임 URL):</label>
            <input type="text" id="base-url-input" value="https://jinbong-t.github.io/brand-crisis-escape/index.html">
            <button id="btn-regenerate" class="btn btn-gold">✨ QR 다시 생성</button>
            <span id="sync-status" style="color: #2ecc71; font-size: 0.8rem; font-weight: 700;"></span>
        </div>
    </header>

    <!-- 인쇄될 원단 QR 카드 시트 -->
    <main class="page-sheet">
        <div id="fabric-cards-grid" class="fabric-grid"></div>
    </main>

    <!-- 내장 원단 이미지 데이터 (file:// 환경에서도 보안 오류 없이 즉시 PNG 다운로드 가능) -->
    <script>
        window.EMBEDDED_FABRIC_URI = "__FABRIC_DATA_URI__";
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBts9CtUvSM0-DG5h5oWa7K32m2LpXytHY",
            authDomain: "brand-crisis-escape.firebaseapp.com",
            projectId: "brand-crisis-escape",
            storageBucket: "brand-crisis-escape.firebasestorage.app",
            messagingSenderId: "1048103557577",
            appId: "1:1048103557577:web:47f72520057057e0e13018",
            measurementId: "G-JBZKBCTCXN"
        };

        const DEFAULT_DEPTS = [
            { id: '디자인기획부' },
            { id: '소재개발부' },
            { id: '스타일링부' },
            { id: '생산전략부' },
            { id: '마케팅부' },
            { id: '품질관리부' }
        ];

        let currentDepts = [...DEFAULT_DEPTS];

        const gridEl = document.getElementById('fabric-cards-grid');
        const classInput = document.getElementById('class-select');
        const urlInput = document.getElementById('base-url-input');
        const bgModeSelect = document.getElementById('bg-mode-select');
        const colsSelect = document.getElementById('cols-select');
        const syncStatus = document.getElementById('sync-status');

        if (window.location.protocol.startsWith('http')) {
            urlInput.value = window.location.href.replace(/\/[^\/]*$/, '/index.html');
        }

        // 원단 이미지 객체 미리 로드
        const fabricImg = new Image();
        if (window.EMBEDDED_FABRIC_URI && window.EMBEDDED_FABRIC_URI.startsWith('data:image')) {
            fabricImg.src = window.EMBEDDED_FABRIC_URI;
        } else {
            fabricImg.src = '조각 원단.png';
        }

        function renderFabricQrCards() {
            gridEl.innerHTML = '';
            const baseUrl = urlInput.value.trim().split('?')[0] || 'https://jinbong-t.github.io/brand-crisis-escape/index.html';
            const bgMode = bgModeSelect.value;
            const total = currentDepts.length;
            const cols = total <= 3 ? total : Math.ceil(total / 2);
            const rows = total <= 3 ? 1 : 2;

            currentDepts.forEach((dept, idx) => {
                const qrTargetUrl = `${baseUrl}?qr=true&deptId=${encodeURIComponent(dept.id)}`;

                const colIdx = idx % cols;
                const rowIdx = Math.floor(idx / cols);
                const bgXPercent = cols <= 1 ? 0 : (colIdx / (cols - 1)) * 100;
                const bgYPercent = rows <= 1 ? 0 : (rowIdx / (rows - 1)) * 100;

                const bgStyle = bgMode === 'slice'
                    ? `background-size: ${cols * 100}% ${rows * 100}%; background-position: ${bgXPercent}% ${bgYPercent}%;`
                    : `background-size: cover; background-position: center;`;

                const card = document.createElement('div');
                card.className = 'fabric-swatch-card';
                card.title = `클릭하면 [${dept.id}] 원단 QR 이미지를 저장합니다`;
                card.innerHTML = `
                    <div class="fabric-bg-layer" style="${bgStyle}"></div>
                    <div class="fabric-weave-overlay"></div>
                    <div class="fabric-stitch-border"></div>

                    <div class="woven-qr-patch">
                        <span class="corner-tack tl"></span>
                        <span class="corner-tack tr"></span>
                        <span class="corner-tack bl"></span>
                        <span class="corner-tack br"></span>
                        <div class="qr-frame">
                            <div id="qr-box-${idx}" class="qr-box"></div>
                        </div>
                    </div>
                `;

                gridEl.appendChild(card);

                const qrContainer = document.getElementById(`qr-box-${idx}`);
                if (qrContainer && typeof QRCode !== 'undefined') {
                    new QRCode(qrContainer, {
                        text: qrTargetUrl,
                        width: 240,
                        height: 240,
                        colorDark: '#1a1612',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.L
                    });
                }

                // 개별 카드 클릭 시 해당 카드 PNG 즉시 다운로드
                card.addEventListener('click', async () => {
                    const cardCanvas = await drawSingleCardCanvas(idx, 600);
                    downloadCanvas(cardCanvas, `원단_QR_${idx + 1}_${dept.id}.png`);
                });
            });
        }

        // 둥근 사각형 패스 헬퍼
        function roundRectPath(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        // 고해상도 캔버스에 단일 원단 QR 카드 그리기 (오프라인/file:// 100% 호환)
        async function drawSingleCardCanvas(idx, size = 600) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            const total = currentDepts.length;
            const cols = total <= 3 ? total : Math.ceil(total / 2);
            const rows = total <= 3 ? 1 : 2;
            const colIdx = idx % cols;
            const rowIdx = Math.floor(idx / cols);
            const bgMode = bgModeSelect.value;

            // 1. 카드 외곽 클리핑
            ctx.save();
            roundRectPath(ctx, 0, 0, size, size, 16);
            ctx.clip();

            // 2. 원단 배경 그리기
            if (fabricImg.complete && fabricImg.naturalWidth > 0) {
                const iw = fabricImg.naturalWidth;
                const ih = fabricImg.naturalHeight;
                if (bgMode === 'slice') {
                    const sw = iw / cols;
                    const sh = ih / rows;
                    const sx = colIdx * sw;
                    const sy = rowIdx * sh;
                    ctx.drawImage(fabricImg, sx, sy, sw, sh, 0, 0, size, size);
                } else {
                    const scale = Math.max(size / iw, size / ih);
                    const dw = iw * scale;
                    const dh = ih * scale;
                    ctx.drawImage(fabricImg, (size - dw) / 2, (size - dh) / 2, dw, dh);
                }
            } else {
                ctx.fillStyle = '#efe6d5';
                ctx.fillRect(0, 0, size, size);
            }

            // 3. 미세 직조 라인 질감
            ctx.strokeStyle = 'rgba(120, 95, 65, 0.06)';
            ctx.lineWidth = 1;
            for (let p = 0; p < size; p += 6) {
                ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(size, p); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, size); ctx.stroke();
            }

            // 4. 카드 외곽 테두리
            ctx.strokeStyle = '#cbb89d';
            ctx.lineWidth = 10;
            roundRectPath(ctx, 5, 5, size - 10, size - 10, 14);
            ctx.stroke();

            // 5. 원단 바느질(스티치) 점선 테두리
            ctx.save();
            ctx.strokeStyle = 'rgba(95, 72, 42, 0.65)';
            ctx.lineWidth = 3.5;
            ctx.setLineDash([12, 8]);
            roundRectPath(ctx, 22, 22, size - 44, size - 44, 10);
            ctx.stroke();
            ctx.restore();

            // 6. 중앙 의류 QR 라벨 패치 (원단 안에 쏙 들어가게 56% 크기)
            const patchMargin = Math.round(size * 0.22);
            const patchSize = size - patchMargin * 2;

            ctx.save();
            ctx.shadowColor = 'rgba(45, 32, 16, 0.32)';
            ctx.shadowBlur = 22;
            ctx.shadowOffsetY = 8;
            ctx.fillStyle = '#fffdf9';
            roundRectPath(ctx, patchMargin, patchMargin, patchSize, patchSize, 12);
            ctx.fill();
            ctx.restore();

            ctx.strokeStyle = '#d8ccb8';
            ctx.lineWidth = 3;
            roundRectPath(ctx, patchMargin, patchMargin, patchSize, patchSize, 12);
            ctx.stroke();

            // 라벨 안쪽 실밥 스티치
            ctx.save();
            ctx.strokeStyle = 'rgba(139, 115, 85, 0.7)';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([8, 6]);
            roundRectPath(ctx, patchMargin + 9, patchMargin + 9, patchSize - 18, patchSize - 18, 8);
            ctx.stroke();
            ctx.restore();

            // 네 모서리 리벳 핀
            const tackOffset = 18;
            const tackPositions = [
                [patchMargin + tackOffset, patchMargin + tackOffset],
                [patchMargin + patchSize - tackOffset, patchMargin + tackOffset],
                [patchMargin + tackOffset, patchMargin + patchSize - tackOffset],
                [patchMargin + patchSize - tackOffset, patchMargin + patchSize - tackOffset]
            ];
            tackPositions.forEach(([tx, ty]) => {
                ctx.beginPath();
                ctx.arc(tx, ty, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#c8aa78';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#5a4322';
                ctx.stroke();
            });

            // 7. 정사각형 QR 코드 그리기
            const qrBox = document.getElementById(`qr-box-${idx}`);
            const qrSource = qrBox?.querySelector('canvas') || qrBox?.querySelector('img');
            if (qrSource) {
                const qrPad = Math.round(patchSize * 0.12);
                const qrDrawSize = patchSize - qrPad * 2;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(patchMargin + qrPad - 6, patchMargin + qrPad - 6, qrDrawSize + 12, qrDrawSize + 12);
                ctx.drawImage(qrSource, patchMargin + qrPad, patchMargin + qrPad, qrDrawSize, qrDrawSize);
            }

            ctx.restore();
            return canvas;
        }

        // 캔버스 다운로드 트리거
        function downloadCanvas(canvas, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // [버튼 1] 전체 1장 합본 이미지 자동 저장
        document.getElementById('btn-save-sheet').addEventListener('click', async () => {
            const btn = document.getElementById('btn-save-sheet');
            const origText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '⏳ 이미지 생성 중...';

            try {
                const total = currentDepts.length;
                const cols = colsSelect.value === '2' ? 2 : 3;
                const rows = Math.ceil(total / cols);

                const cardSize = 600;
                const gap = 36;
                const pad = 48;

                const sheetCanvas = document.createElement('canvas');
                sheetCanvas.width = pad * 2 + cols * cardSize + (cols - 1) * gap;
                sheetCanvas.height = pad * 2 + rows * cardSize + (rows - 1) * gap;
                const sCtx = sheetCanvas.getContext('2d');

                // 흰색 인쇄용 배경
                sCtx.fillStyle = '#ffffff';
                sCtx.fillRect(0, 0, sheetCanvas.width, sheetCanvas.height);

                for (let i = 0; i < total; i++) {
                    const c = i % cols;
                    const r = Math.floor(i / cols);
                    const x = pad + c * (cardSize + gap);
                    const y = pad + r * (cardSize + gap);

                    const cardCanvas = await drawSingleCardCanvas(i, cardSize);
                    sCtx.drawImage(cardCanvas, x, y);
                }

                const targetClass = classInput.value.trim() || '전체';
                downloadCanvas(sheetCanvas, `원단_QR_카드_${targetClass}_전체합본.png`);
                btn.textContent = '✅ 저장 완료!';
            } catch (e) {
                console.error(e);
                alert('이미지 저장 중 오류가 발생했습니다: ' + e.message);
                btn.textContent = origText;
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    btn.textContent = origText;
                }, 1500);
            }
        });

        // [버튼 2] 6장 개별 파일로 연속 자동 저장
        document.getElementById('btn-save-each').addEventListener('click', async () => {
            const btn = document.getElementById('btn-save-each');
            const origText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '⏳ 6장 연속 저장 중...';

            try {
                for (let i = 0; i < currentDepts.length; i++) {
                    const dept = currentDepts[i];
                    const cardCanvas = await drawSingleCardCanvas(i, 600);
                    downloadCanvas(cardCanvas, `원단_QR_${i + 1}_${dept.id}.png`);
                    await new Promise(r => setTimeout(r, 280));
                }
                btn.textContent = '✅ 6장 저장 완료!';
            } catch (e) {
                console.error(e);
                alert('개별 저장 중 오류가 발생했습니다: ' + e.message);
                btn.textContent = origText;
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    btn.textContent = origText;
                }, 1500);
            }
        });

        // [버튼 3] 전체 6장 A4 1장 완벽 인쇄 (배경 그래픽 체크 여부와 무관하게 6장 모두 100% 인쇄)
        document.getElementById('btn-print-all').addEventListener('click', async () => {
            const btn = document.getElementById('btn-print-all');
            const origText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '⏳ 인쇄 준비 중...';

            try {
                const dataUrls = [];
                for (let i = 0; i < currentDepts.length; i++) {
                    const cardCanvas = await drawSingleCardCanvas(i, 600);
                    dataUrls.push(cardCanvas.toDataURL('image/png'));
                }

                const printWin = window.open('', '_blank', 'width=900,height=950');
                if (!printWin) {
                    window.print();
                    return;
                }

                printWin.document.write(`
                    <!DOCTYPE html>
                    <html lang="ko">
                    <head>
                        <meta charset="UTF-8">
                        <title>원단 QR 카드 6장 인쇄</title>
                        <style>
                            @page {
                                size: A4 portrait;
                                margin: 10mm;
                            }
                            * {
                                box-sizing: border-box;
                                margin: 0;
                                padding: 0;
                            }
                            body {
                                background: #ffffff;
                                display: flex;
                                flex-direction: column;
                                align-items: center;
                                justify-content: center;
                                font-family: 'Noto Sans KR', sans-serif;
                            }
                            .print-grid {
                                width: 180mm;
                                display: grid;
                                grid-template-columns: repeat(2, 84mm);
                                grid-template-rows: repeat(3, 84mm);
                                justify-content: center;
                                gap: 8mm;
                                margin: 0 auto;
                            }
                            .print-card {
                                width: 84mm;
                                height: 84mm;
                                display: block;
                                object-fit: contain;
                                page-break-inside: avoid;
                                break-inside: avoid;
                            }
                        </style>
                    </head>
                    <body>
                        <div class="print-grid">
                            ${dataUrls.map((src, idx) => `<img class="print-card" src="${src}" alt="원단 QR ${idx + 1}">`).join('')}
                        </div>
                        <script>
                            window.onload = function() {
                                setTimeout(function() {
                                    window.focus();
                                    window.print();
                                }, 250);
                            };
                        <\/script>
                    </body>
                    </html>
                `);
                printWin.document.close();
            } catch (e) {
                console.error(e);
                window.print();
            } finally {
                btn.disabled = false;
                btn.textContent = origText;
            }
        });

        async function syncFromFirebase(useGlobalActiveClass = false) {
            try {
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);

                let targetClass = classInput.value.trim() || '3-1';

                if (useGlobalActiveClass) {
                    const globalSnap = await getDoc(doc(db, 'global', 'config'));
                    if (globalSnap.exists() && globalSnap.data().currentActiveSession) {
                        targetClass = globalSnap.data().currentActiveSession;
                        classInput.value = targetClass;
                    }
                }

                const qrConfigSnap = await getDoc(doc(db, `classes/${targetClass}/global`, 'qrConfig'));
                if (qrConfigSnap.exists() && qrConfigSnap.data().savedGameUrl) {
                    urlInput.value = qrConfigSnap.data().savedGameUrl.split('?')[0];
                }

                const deptSnap = await getDocs(collection(db, `classes/${targetClass}/departments`));
                if (!deptSnap.empty) {
                    const loadedDepts = [];
                    deptSnap.forEach(d => loadedDepts.push({ id: d.id }));
                    // 만약 테스트 중이라 DB에 부서가 6개 미만으로 생성되어 있어도 기본 6개 부서를 모두 채워 항상 6장 출력 보장!
                    DEFAULT_DEPTS.forEach(def => {
                        if (!loadedDepts.some(ld => ld.id === def.id)) {
                            loadedDepts.push({ id: def.id });
                        }
                    });
                    currentDepts = loadedDepts;
                    syncStatus.textContent = `✅ [${targetClass}]반 (${currentDepts.length}장 전체 준비됨)`;
                } else {
                    currentDepts = [...DEFAULT_DEPTS];
                    syncStatus.textContent = `✅ 전체 6장 준비 완료`;
                }

                renderFabricQrCards();
            } catch (err) {
                currentDepts = [...DEFAULT_DEPTS];
                renderFabricQrCards();
            }
        }

        document.getElementById('btn-load-firebase').addEventListener('click', () => syncFromFirebase(false));
        document.getElementById('btn-regenerate').addEventListener('click', renderFabricQrCards);
        bgModeSelect.addEventListener('change', renderFabricQrCards);

        colsSelect.addEventListener('change', () => {
            gridEl.classList.toggle('cols-2', colsSelect.value === '2');
        });

        renderFabricQrCards();
        syncFromFirebase(true);
    </script>
</body>
</html>
