<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2330"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d76e"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7b1c"/>
    </linearGradient>
  </defs>
  <!-- 럭셔리 다크 골드 라운드 배경 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="url(#gold)" stroke-width="3"/>
  <!-- 스티치 점선 테두리 -->
  <rect x="6" y="6" width="52" height="52" rx="10" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"/>
  <!-- RE:BRAND 크라운 & 옷걸이 심볼 -->
  <path d="M16 30 L22 18 L32 26 L42 18 L48 30 Z" fill="url(#gold)"/>
  <circle cx="22" cy="15" r="2.5" fill="#f5d76e"/>
  <circle cx="32" cy="13" r="3" fill="#f5d76e"/>
  <circle cx="42" cy="15" r="2.5" fill="#f5d76e"/>
  <!-- 하단 친환경 리프 & 브랜드 R 이니셜 -->
  <text x="32" y="50" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="url(#gold)" text-anchor="middle" letter-spacing="1">RE</text>
</svg>
